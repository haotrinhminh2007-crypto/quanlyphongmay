<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lịch ca – LabManager</title>
  <link rel="stylesheet" href="css/chung.css">
  <link rel="stylesheet" href="css/lich.css">
</head>
<body>
  <div class="app">

    <!-- Thanh menu bên trái -->
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">🏢</span>
        <div><b>LabManager</b><small>Pro</small></div>
      </div>
      <nav id="menu">
        <a href="tongquan.html"><i>📊</i>Tổng quan</a>
        <a href="lich.html" class="active"><i>📅</i>Đặt lịch ca</a>
        <a href="phong-may.html"><i>🖥️</i>Phòng máy</a>
        <a href="#"><i>💻</i>Máy tính</a>
        <a href="#"><i>🔧</i>Sự cố &amp; bảo trì</a>
        <a href="#"><i>📈</i>Báo cáo</a>
        <a href="#"><i>👥</i>Người dùng</a>
      </nav>
      <div class="me">
        <span class="avatar">HN</span>
        <div><b>Hà Nguyễn</b><small>Quản trị viên</small></div>
      </div>
    </aside>

    <!-- Nội dung chính -->
    <main class="content">
      <header class="header">
        <div>
          <h1>Đặt lịch ca</h1>
          <p>Đăng kí ca thực hành cho lớp học phần theo từng phòng máy.</p>
        </div>
        <div class="header-right">
          <span class="date" id="homNay">Thứ tư, 07/10/2026</span>
          <div class="plus-wrap">
            <button class="plus" id="plus" aria-label="Đăng kí ca mới" aria-expanded="false" aria-controls="pop">+</button>
            <div class="toast" id="toast" role="status" aria-live="polite"></div>
            <form class="pop" id="pop" autocomplete="off">
              <h2>Đăng kí ca thực hành</h2>
              <label for="f-date">Ngày</label>
              <input class="in" type="date" id="f-date" required>
              <label>Chọn phòng máy</label>
              <div class="roompick" id="f-room">
                <label><input type="radio" name="room" value="1" checked><span>Phòng 1</span></label>
                <label><input type="radio" name="room" value="2"><span>Phòng 2</span></label>
                <label><input type="radio" name="room" value="3"><span>Phòng 3</span></label>
                <label><input type="radio" name="room" value="4"><span>Phòng 4</span></label>
              </div>
              <label for="f-cls">Lớp học phần</label>
              <input class="in" type="text" id="f-cls" placeholder="Ví dụ: INT1306-01" required maxlength="60">
              <label>Ca thực hành (chọn một hoặc nhiều ca)</label>
              <div class="shifts" id="f-shifts"></div>
              <button class="submit" type="submit">Đăng kí</button>
            </form>
          </div>
        </div>
      </header>

      <section class="body">
        <div class="tools">
          <div class="seg" role="tablist">
            <button class="on" data-view="cur">Lịch hiện tại</button>
            <button data-view="his">Lịch sử</button>
          </div>
          <span id="weekctl">
            <button class="ghost" id="prev" aria-label="Tuần trước">‹</button>
            <span class="week-label" id="wlabel"></span>
            <button class="ghost" id="next" aria-label="Tuần sau">›</button>
            <button class="ghost" id="thisweek">Hôm nay</button>
          </span>
        </div>
        <div class="grid-wrap" id="calwrap"><table class="cal" id="cal"></table></div>
        <div class="hist" id="hist" style="display:none"></div>
      </section>
    </main>

  </div>
  <script src="js/data.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/lich.js"></script>
 
</body>
</html>

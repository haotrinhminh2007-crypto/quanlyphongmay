<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tổng quan – LabManager</title>
  <link rel="stylesheet" href="css/chung.css">
  <link rel="stylesheet" href="css/tongquan.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
      <header class="header">
        <div>
          <h1>Xin chào, <span id="tenNguoiDung">Hà Nguyễn</span> 👋</h1>
          <p>Tình hình vận hành phòng máy, lịch sử dụng và sự cố cần xử lý hôm nay.</p>
        </div>
        <div class="header-right">
          <span class="date" id="homNay"></span>
          <a href="phong-may.html"><button class="btn-dark">Quản lý phòng máy</button></a>
        </div>
      </header>

      <section class="stats">
        <div class="stat c-blue">
          <div class="stat-top"><span class="label">Phòng máy</span><span class="icon">🏢</span></div>
          <strong id="soPhong">0</strong><small>Đang hoạt động</small>
        </div>
        <div class="stat c-green">
          <div class="stat-top"><span class="label">Máy tính</span><span class="icon">🖥️</span></div>
          <strong id="soMay">0</strong><small id="ghiChuMay"></small>
        </div>
        <div class="stat c-orange">
          <div class="stat-top"><span class="label">Ca sử dụng hôm nay</span><span class="icon">📅</span></div>
          <strong id="soCa">0</strong><small id="ghiChuCa"></small>
        </div>
        <div class="stat c-red">
          <div class="stat-top"><span class="label">Sự cố chưa xử lý</span><span class="icon">⚠️</span></div>
          <strong id="soSuCo">0</strong><small class="red" id="chiPhi"></small>
        </div>
      </section>

      <section class="charts">
        <div class="box"><h3>Máy tính theo phòng</h3><div class="chart-wrap"><canvas id="bieuDoCot"></canvas></div></div>
        <div class="box"><h3>Tình trạng máy tính</h3><div class="chart-wrap"><canvas id="bieuDoTron"></canvas></div></div>
      </section>
    </main>
  </div>

  <!-- THỨ TỰ QUAN TRỌNG: thư viện -> data -> menu -> js riêng của trang -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/tongquan.js"></script>
</body>
</html>
